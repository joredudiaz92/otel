apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: observability
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS productos (
      id SERIAL PRIMARY KEY,
      nombre VARCHAR(100) NOT NULL,
      precio NUMERIC(10, 2) NOT NULL,
      stock INT NOT NULL
    );

    INSERT INTO productos (nombre, precio, stock) VALUES
      ('Laptop Pro 15', 1299.99, 10),
      ('Teclado Mecánico', 89.50, 45),
      ('Mouse Inalámbrico', 29.99, 100),
      ('Monitor 4K 27"', 349.00, 15);
---
# --- POSTGRESQL ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: appdb
        - name: POSTGRES_USER
          value: user
        - name: POSTGRES_PASSWORD
          value: secret
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: observability
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
---
# --- JAEGER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        ports:
        - containerPort: 16686 # Web UI
        - containerPort: 4317  # OTLP gRPC
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  ports:
  - name: ui
    port: 16686
    targetPort: 16686
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  selector:
    app: jaeger
---
# --- OPENTELEMETRY COLLECTOR CONFIG ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      otlp/jaeger:
        endpoint: jaeger.observability.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
      debug:
        verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug] # Los logs se envían a la consola centralizada
---
# --- OPENTELEMETRY COLLECTOR DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:latest
        args: ["--config=/etc/otelcol/otel-collector-config.yaml"]
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol
        ports:
        - containerPort: 4317 # OTLP gRPC
        - containerPort: 4318 # OTLP HTTP
        - containerPort: 8889 # Exporter Prometheus
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  ports:
  - name: otlp-grpc
    port: 4317
  - name: otlp-http
    port: 4318
  - name: metrics-prom
    port: 8889
  selector:
    app: otel-collector
---
# --- PROMETHEUS CONFIGMAP (REGLAS DE ALERTA) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alert.rules.yml

    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']

  alert.rules.yml: |
    groups:
      - name: microservices_alerts
        rules:
          # Alerta Latencia P95 > 500ms
          - alert: HighLatencyP95
            expr: histogram_quantile(0.95, sum(rate(http_server_duration_milliseconds_bucket[1m])) by (le, service_name)) > 500
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "Latencia P95 alta en {{ $labels.service_name }}"
              description: "El percentil 95 de latencia ha superado los 500ms (Valor actual: {{ $value }}ms)."

          # Alerta uso de CPU > 70%
          - alert: HighCpuUsage
            expr: rate(process_cpu_seconds_total[1m]) * 100 > 70
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Uso de CPU alto en {{ $labels.service_name }}"
              description: "El servicio {{ $labels.service_name }} superó el 70% de consumo de CPU."

          # Alerta uso de Memoria > 70% (Heap respecto a límite asignado/máximo)
          - alert: HighMemoryUsage
            expr: (process_resident_memory_bytes / 1024 / 1024) > 350 # Ejemplo de umbral alto para pods de Node.js
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "Uso de Memoria elevado en {{ $labels.service_name }}"
              description: "El servicio {{ $labels.service_name }} está consumiendo memoria sobre el umbral configurado."
---
# --- PROMETHEUS DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  ports:
  - port: 9090
  selector:
    app: prometheus
---
# --- GRAFANA PROVISIONING: DATASOURCES ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
---
# --- GRAFANA PROVISIONING: DASHBOARD PROVIDER ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
# --- GRAFANA PROVISIONING: DASHBOARD COMPLETO (JSON) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-json
  namespace: observability
data:
  services-overview.json: |
    {
      "editable": true,
      "panels": [
        {
          "title": "Tasa de Peticiones HTTP por Servicio (req/sec)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(http_server_duration_milliseconds_count[1m])) by (service_name)",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "title": "Percentiles de Latencia HTTP (p50, p95, p99) en ms",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "histogram_quantile(0.50, sum(rate(http_server_duration_milliseconds_bucket[1m])) by (le, service_name))",
              "legendFormat": "p50 - {{service_name}}"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_server_duration_milliseconds_bucket[1m])) by (le, service_name))",
              "legendFormat": "p95 - {{service_name}}"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "histogram_quantile(0.99, sum(rate(http_server_duration_milliseconds_bucket[1m])) by (le, service_name))",
              "legendFormat": "p99 - {{service_name}}"
            }
          ]
        },
        {
          "title": "Uso de CPU por Servicio (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "rate(process_cpu_seconds_total[1m]) * 100",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "title": "Uso de Memoria (RAM) por Servicio (MB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "process_resident_memory_bytes / 1024 / 1024",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "title": "Efectivo E/S Red por Servicio (Bytes/sec)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(http_server_request_size_bytes_sum[1m])) by (service_name)",
              "legendFormat": "Entrada (Rx) - {{service_name}}"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(http_server_response_size_bytes_sum[1m])) by (service_name)",
              "legendFormat": "Salida (Tx) - {{service_name}}"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["microservices", "otel", "resources"],
      "time": { "from": "now-15m", "to": "now" },
      "title": "Microservicios - Observabilidad OTel + Recursos",
      "uid": "otel-microservices-resources"
    }
---
# --- GRAFANA DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards-json
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards-json
        configMap:
          name: grafana-dashboards-json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  ports:
  - port: 3000
  selector:
    app: grafana