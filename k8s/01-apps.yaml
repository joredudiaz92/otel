apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
      - name: service-b
        image: service-b:v5
        imagePullPolicy: Never
        env:
        - name: DB_HOST
          value: "postgres.observability.svc.cluster.local"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4317"
        - name: OTEL_SERVICE_NAME
          value: "service-b"
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: observability
spec:
  ports:
  - port: 8081
  selector:
    app: service-b
---
